<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba sonora</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #button {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    opacity: 1;
    transition: opacity 2s ease;
  }
  #button.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #error {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    padding: 30px;
    box-sizing: border-box;
    font: 16px/1.4 sans-serif;
    text-align: center;
    background: white;
  }
</style>
</head>
<body>
<img id="button" src="boton.jpg" alt="Pulsa para escuchar">
<div id="error"></div>

<audio id="audio" src="prueba_30s.wav" preload="auto" playsinline></audio>

<script>
/*
  DEMO:
  La emisión comienza en este momento UTC.
  Para la exposición real cambia SOLO esta fecha/hora.
*/
const EMISSION_START = new Date("2026-09-21T14:38:24.381446Z").getTime();

const audio = document.getElementById("audio");
const button = document.getElementById("button");
const error = document.getElementById("error");

button.addEventListener("click", async () => {
  // Calculate where the global "broadcast" currently is.
  const elapsedSeconds = Math.max(0, (Date.now() - EMISSION_START) / 1000);
  const position = elapsedSeconds % audio.duration;

  try {
    audio.currentTime = position;
    await audio.play();

    // Fade the button away over 2 seconds.
    requestAnimationFrame(() => button.classList.add("hidden"));
  } catch (e) {
    error.style.display = "flex";
    error.textContent = "No se ha podido iniciar el audio. Toca de nuevo la pantalla.";
  }
});

// Keep the audio synchronized after looping.
// When the file ends, jump to the position corresponding to the global clock.
audio.addEventListener("ended", () => {
  const elapsedSeconds = Math.max(0, (Date.now() - EMISSION_START) / 1000);
  audio.currentTime = elapsedSeconds % audio.duration;
  audio.play().catch(() => {});
});
</script>
</body>
</html>
