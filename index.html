<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AEON</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    body {
      position: relative;
    }

    /* IMAGEN PRINCIPAL */
    #button {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      z-index: 10;

      opacity: 1;
      transition: opacity 2s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    #button.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /*
      Capa invisible que ocupa toda la pantalla.
      Permite volver a mostrar/ocultar la imagen
      cuando el audio ya está reproduciéndose.
    */
    #touch-layer {
      position: fixed;
      inset: 0;
      z-index: 5;
      cursor: pointer;
      display: none;
    }

    #touch-layer.active {
      display: block;
    }

    /* MENSAJE DE ERROR */
    #error {
      position: fixed;
      inset: 0;
      z-index: 30;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 30px;
      text-align: center;

      font-family: sans-serif;
      font-size: 14px;
      color: black;
      background: white;
    }
  </style>
</head>

<body>

  <!-- Imagen de interacción -->
  <img
    id="button"
    src="boton.jpg"
    alt=""
    draggable="false"
  >

  <!-- Zona invisible para interactuar cuando la imagen está oculta -->
  <div id="touch-layer"></div>

  <!-- Dos reproductores usando EL MISMO archivo -->
  <audio
    id="audioA"
    src="new-era.mp3"
    preload="auto"
    playsinline
  ></audio>

  <audio
    id="audioB"
    src="new-era.mp3"
    preload="auto"
    playsinline
  ></audio>

  <div id="error"></div>

  <script>

    /*
     * ============================================================
     * CONFIGURACIÓN
     * ============================================================
     */

    const EMISSION_START =
      new Date("2026-09-21T14:38:24.381446Z").getTime();

    /*
     * Duración del crossfade entre un ciclo y el siguiente.
     *
     * 0.25 = 250 ms
     *
     * Si todavía notas un pequeño salto:
     * prueba 0.35 o 0.50.
     */
    const CROSSFADE = 0.30;


    /*
     * ============================================================
     * ELEMENTOS
     * ============================================================
     */

    const button = document.getElementById("button");
    const touchLayer = document.getElementById("touch-layer");
    const error = document.getElementById("error");

    const audioA = document.getElementById("audioA");
    const audioB = document.getElementById("audioB");


    /*
     * ============================================================
     * ESTADO
     * ============================================================
     */

    let started = false;
    let muted = false;

    let activeAudio = audioA;
    let nextAudio = audioB;

    let loopTimer = null;
    let fadeTimer = null;


    /*
     * ============================================================
     * POSICIÓN GLOBAL
     * ============================================================
     */

    function getGlobalPosition() {

      const duration = activeAudio.duration;

      if (!duration || !isFinite(duration)) {
        return 0;
      }

      return (
        Math.max(
          0,
          (Date.now() - EMISSION_START) / 1000
        ) % duration
      );
    }


    /*
     * ============================================================
     * PREPARAR EL SEGUNDO AUDIO
     * ============================================================
     */

    function prepareNextAudio(position) {

      nextAudio.currentTime = position;
      nextAudio.volume = 0;
      nextAudio.muted = false;
    }


    /*
     * ============================================================
     * CROSSFADE
     * ============================================================
     */

    function crossfade() {

      if (!started || muted) return;

      const current = activeAudio;
      const next = nextAudio;

      if (
        !current.duration ||
        !isFinite(current.duration)
      ) {
        return;
      }

      /*
       * El siguiente reproductor empieza desde el principio.
       */
      next.currentTime = 0;
      next.volume = 0;

      next.play().catch(() => {});

      const startTime = performance.now();

      clearInterval(fadeTimer);

      fadeTimer = setInterval(() => {

        const elapsed =
          (performance.now() - startTime) / 1000;

        const progress =
          Math.min(1, elapsed / CROSSFADE);

        /*
         * Fade out del audio actual.
         */
        current.volume = 1 - progress;

        /*
         * Fade in del siguiente.
         */
        next.volume = progress;

        if (progress >= 1) {

          clearInterval(fadeTimer);

          current.pause();
          current.currentTime = 0;
          current.volume = 1;

          /*
           * Intercambiamos los reproductores.
           */
          activeAudio = next;
          nextAudio = current;

          /*
           * Programamos el siguiente loop.
           */
          scheduleNextLoop();
        }

      }, 16);
    }


    /*
     * ============================================================
     * PROGRAMAR SIGUIENTE LOOP
     * ============================================================
     */

    function scheduleNextLoop() {

      clearTimeout(loopTimer);

      if (!started || muted) return;

      const duration = activeAudio.duration;

      if (!duration || !isFinite(duration)) {
        return;
      }

      const delay =
        Math.max(
          0,
          (duration - CROSSFADE) * 1000
        );

      loopTimer = setTimeout(() => {

        if (!started || muted) return;

        crossfade();

      }, delay);
    }


    /*
     * ============================================================
     * INICIAR AUDIO
     * ============================================================
     */

    async function startAudio() {

      try {

        /*
         * Esperamos a que el navegador conozca
         * la duración del MP3.
         */
        if (!audioA.duration) {

          await new Promise((resolve) => {

            if (audioA.duration) {
              resolve();
              return;
            }

            audioA.addEventListener(
              "loadedmetadata",
              resolve,
              { once: true }
            );

          });

        }

        const position = getGlobalPosition();

        audioA.currentTime = position;
        audioA.volume = 1;
        audioA.muted = false;

        audioB.pause();
        audioB.currentTime = 0;
        audioB.volume = 0;

        await audioA.play();

        activeAudio = audioA;
        nextAudio = audioB;

        started = true;
        muted = false;

        /*
         * La imagen desaparece lentamente.
         */
        requestAnimationFrame(() => {
          button.classList.add("hidden");
        });

        /*
         * Activamos la zona invisible.
         */
        touchLayer.classList.add("active");

        /*
         * Programamos el crossfade.
         */
        scheduleNextLoop();

      } catch (e) {

        console.error(e);

        error.style.display = "flex";
        error.textContent =
          "No se ha podido iniciar el audio. Toca de nuevo la pantalla.";

      }
    }


    /*
     * ============================================================
     * MOSTRAR / OCULTAR IMAGEN
     * ============================================================
     */

    function showImage() {
      button.classList.remove("hidden");
    }

    function hideImage() {
      button.classList.add("hidden");
    }


    /*
     * ============================================================
     * SILENCIAR / REANUDAR
     * ============================================================
     */

    function toggleSound() {

      if (!started) return;

      if (!muted) {

        /*
         * SILENCIAR
         */

        muted = true;

        clearTimeout(loopTimer);
        clearInterval(fadeTimer);

        /*
         * Los dos audios se silencian.
         */
        audioA.muted = true;
        audioB.muted = true;

        /*
         * La imagen vuelve a aparecer.
         */
        showImage();

      } else {

        /*
         * REANUDAR
         */

        muted = false;

        /*
         * Calculamos la posición global actual
         * para volver a sincronizar.
         */
        const position = getGlobalPosition();

        activeAudio.currentTime = position;

        audioA.muted = true;
        audioB.muted = true;

        activeAudio.muted = false;
        activeAudio.volume = 1;

        activeAudio.play().catch(() => {});

        /*
         * La imagen vuelve a desaparecer.
         */
        hideImage();

        /*
         * Volvemos a programar el crossfade.
         */
        scheduleNextLoop();

      }
    }


    /*
     * ============================================================
     * EVENTOS
     * ============================================================
     */

    button.addEventListener("click", startAudio);

    touchLayer.addEventListener(
      "click",
      toggleSound
    );


    /*
     * Evitamos que el navegador intente
     * reproducir los audios simultáneamente
     * cuando llegan al final.
     */
    audioA.addEventListener("ended", () => {
      if (!started || muted) return;
      audioA.currentTime = 0;
    });

    audioB.addEventListener("ended", () => {
      if (!started || muted) return;
      audioB.currentTime = 0;
    });

  </script>

</body>
</html>
